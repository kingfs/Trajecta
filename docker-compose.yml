services:
  trajecta:
    image: kingfs/trajecta:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRAJECTA_CONFIG: /app/config/config.yaml
      TRAJECTA_OUTPUT_DIR: /app/data/traces
      TRAJECTA_TRACE_OUTPUT_DIR: /app/data/traces
      TRAJECTA_DATABASE_DRIVER: postgres
      TRAJECTA_DATABASE_DSN: ${TRAJECTA_DATABASE_DSN:-postgres://trajecta:${POSTGRES_PASSWORD:-trajecta}@postgres:5432/${POSTGRES_DB:-trajecta}?sslmode=disable}
      TRAJECTA_BOOTSTRAP_UPSTREAM_BASE_URL: ${TRAJECTA_BOOTSTRAP_UPSTREAM_BASE_URL:-}
      TRAJECTA_BOOTSTRAP_UPSTREAM_API_KEY: ${TRAJECTA_BOOTSTRAP_UPSTREAM_API_KEY:-}
      TRAJECTA_RESPONSES_CODEX_COMPAT_ENABLED: ${TRAJECTA_RESPONSES_CODEX_COMPAT_ENABLED:-true}
      TRAJECTA_RESPONSES_CODEX_COMPAT_AUTO_INJECT_HOSTED_TOOLS: ${TRAJECTA_RESPONSES_CODEX_COMPAT_AUTO_INJECT_HOSTED_TOOLS:-web_search}
      TRAJECTA_TOOLS_WEB_SEARCH_ENABLED: ${TRAJECTA_TOOLS_WEB_SEARCH_ENABLED:-true}
    ports:
      - "${TRAJECTA_HOST_SERVER_PORT:-8080}:8080"
      - "${TRAJECTA_HOST_MONITOR_PORT:-8081}:8081"
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - trajecta-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - serve
      - -c
      - /app/config/config.yaml

  postgres:
    image: postgres:17-alpine
    # 并行查询的动态共享内存段分配在 /dev/shm，容器默认只有 64 MB：并发会话使用
    # 并行 hash 节点时会直接失败（could not resize shared memory segment ... No
    # space left on device），实测连 logs 这种 26 万行量级的 count(*) 都会被拒。
    # 详见 docs/POSTGRES_OPERATIONS.md「大表聚合的内存与并行度」。
    shm_size: "1gb"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trajecta}
      POSTGRES_USER: ${POSTGRES_USER:-trajecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trajecta}
    ports:
      - "${TRAJECTA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  searxng:
    image: searxng/searxng:latest
    profiles:
      - search
    environment:
      BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8088/}
      INSTANCE_NAME: ${SEARXNG_INSTANCE_NAME:-trajecta-searxng}
      SEARXNG_SETTINGS_PATH: /etc/searxng/settings.yml
    ports:
      - "${SEARXNG_PORT:-8088}:8080"
    volumes:
      - searxng-data:/etc/searxng
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./config/searxng/limiter.toml:/etc/searxng/limiter.toml:ro

volumes:
  trajecta-data:
  postgres-data:
  searxng-data:
