server:
  port: "8080"

monitor:
  port: "8081"
  # Timezone for the day-based windows ("today") and the calendar buckets in the
  # Monitor. It defaults to Asia/Shanghai; the API is unaffected, only how a
  # window is bounded and how its buckets are labelled.
  timezone: "Asia/Shanghai"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "postgres"
  dsn: ""
  max_open_conns: 16
  max_idle_conns: 8
  # A second pool serves the read-only statements the Monitor and MCP issue, so a
  # cold page cannot hold every connection the proxy needs to persist what it just
  # recorded. On the reference deployment a cold 30-day Overview took 14 s while
  # holding the only four connections the recording path had. This is enabled by
  # default because the isolation is the point; the total connection count is
  # read_max_open_conns plus max_open_conns. 0 disables the split and leaves every
  # statement on the single pool above.
  read_max_open_conns: 4
  read_max_idle_conns: 4
  # Bound on one read-path statement. 0 disables it. It is deliberately not a few
  # seconds: the slowest legitimate cold read measured on the reference deployment
  # was a 30-day Overview at 14 s, and a five-second bound would turn slow pages
  # into errors. This still kills a runaway read and returns the connection.
  read_statement_timeout: 0s
  auto_migrate: true
  # Serve the session list from the derived read model `session_summaries` instead
  # of grouping the log window on every request. On the reference deployment the
  # log path costs 506 ms for the COUNT(DISTINCT session_id) plus 106 ms for the
  # GROUP BY, against 5 ms and 0.4 ms from the summary, a difference of roughly two
  # orders of magnitude on a page the UI polls.
  #
  # The code default stays false, and this file turns it on, because enabling it is
  # only safe once the summary covers the same sessions the log path does: the
  # summary is a derived read model filled in the background, so a deployment whose
  # backfill has not finished would silently show the summarised subset. Verify
  # parity first - the query in docs/POSTGRES_OPERATIONS.md compares
  # request_count, first_seen, last_seen, total_tokens, last_model and
  # failed_request per sampled session - then enable it here or with
  # TRAJECTA_DATABASE_USE_SESSION_SUMMARY_READ=true. The `model` and `q` filters
  # always stay on the log path, because a summary row only holds the last model.
  use_session_summary_read: true

trace:
  output_dir: "./data/traces"
  # How often the background reconciliation walks the cassette directory. A
  # cassette is indexed when it is written, so this is a backstop for files that
  # appeared while the process was down; on a large install each pass re-reads
  # every prelude, which is why the default is half an hour rather than minutes.
  sync_interval: 30m

# The local Responses execution mode is always available: /v1/responses is
# served by a native Responses upstream when one serves the model, and by the
# local Responses server over a chat completions upstream otherwise. To opt out
# of local translation, set responses_strategy to "native_only" in the Monitor
# Routing settings (stored in the application DB under the app_settings key
# routing.settings, not in this file). The former enabled switch was removed.
responses_server:
  default_model: ""
  force_store: true
  # Image inputs are commonly sent as base64 data URLs. Keep this above the
  # default text-only request size so image generation is not rejected locally.
  max_request_body_bytes: 67108864
  path: "/v1/responses"
  auto_compact: true
  compact_history_item_threshold: 80
  adopt_channel_model_profiles: true
  codex_compat:
    enabled: true
    auto_inject_hosted_tools: ["web_search"]
    inject_when_tools_absent: true
    preserve_client_tools: true
    default_tool_choice: "auto"
  function_executors:
    enabled: false
    timeout: 2s
    max_result_bytes: 65536
    redaction:
      arguments: true
      output: true
    executors: []

tools:
  web_search:
    enabled: true
    provider: "searxng"
    max_results: 5
    base_url: "http://searxng:8080"
    timeout_ms: 5000
    user_agent: "trajecta/production"
  mcp:
    enabled: true
    default_timeout_ms: 60000
    max_result_bytes: 65536
    servers: []

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m
  selection:
    policy: "p2c"
    epsilon: 0.02
    open_window: 15s
    failure_threshold: 3
  fallback:
    on_missing_model: "reject"

debug:
  output_dir: "./data/traces"
  mask_key: true

chaos:
  enabled: false
  rules: []
