server:
  port: "8080"

monitor:
  port: "8081"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "./logs/local"

# The local Responses execution mode is always available; to opt out of local
# translation, set responses_strategy to "native_only" in the Monitor Routing
# settings (application DB app_settings key "routing.settings", not a YAML key).
responses_server:
  default_model: "gpt-4o-mini"
  force_store: false
  path: "/v1/responses"

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m
  selection:
    policy: "p2c"
    epsilon: 0.02
    open_window: 15s
    failure_threshold: 3

# Channels are configured in the Monitor and stored in the application database.
debug:
  output_dir: "./logs/local"
  mask_key: true

chaos:
  enabled: false
  rules: []
