server:
  port: "8080"

monitor:
  port: "8081"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "postgres"
  dsn: "$env:TRAJECTA_DATABASE_DSN"
  max_open_conns: 16
  max_idle_conns: 8
  auto_migrate: true

trace:
  output_dir: "./data/traces"

# The local Responses execution mode is always available; to opt out of local
# translation, set responses_strategy to "native_only" in the Monitor Routing
# settings (application DB app_settings key "routing.settings", not a YAML key).
responses_server:
  default_model: "$env:TRAJECTA_RESPONSES_DEFAULT_MODEL"
  force_store: true
  max_request_body_bytes: 67108864
  path: "/v1/responses"
  auto_compact: true
  compact_history_item_threshold: 80
  model_profiles:
    - pattern: "*"
      context_window_tokens: 128000
      max_output_tokens: 4096
      compact_history_item_threshold: 80
      upstream_model: "$env:TRAJECTA_RESPONSES_DEFAULT_MODEL"

tools:
  web_search:
    enabled: false
    provider: "searxng"
    max_results: 5
    base_url: "http://searxng:8080"
    timeout_ms: 5000

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m
  selection:
    policy: "p2c"
    epsilon: 0.02
    open_window: 15s
    failure_threshold: 3

# Channels are configured in the Monitor and stored in the application database.
debug:
  output_dir: "./data/traces"
  mask_key: true

chaos:
  enabled: false
  rules: []
