# Live functional-test configuration for a host-side (non-container) run with
# SQLite. Used for CLI spot checks and quick proxy smoke tests.
#
# Secrets are referenced through $env: so this file is safe to keep in the repo.
server:
  port: "18090"

monitor:
  port: "18091"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "$env:TRAJECTA_LIVE_SQLITE_DIR"

responses_server:
  default_model: "deepseek-flash"
  force_store: true
  auto_compact: true
  codex_compat:
    enabled: false
  function_executors:
    enabled: false

tools:
  web_search:
    enabled: false
    provider: "disabled"
  mcp:
    enabled: false
    servers: []

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m
  fallback:
    on_missing_model: "reject"

upstreams:
  - id: "baizhi-openai"
    enabled: true
    priority: 100
    weight: 1.0
    capacity_hint: 1.0
    model_discovery: "list_models"
    static_models: ["deepseek-flash"]
    upstream:
      base_url: "$env:TRAJECTA_LIVE_CHAT_BASE"
      api_key: "$env:TRAJECTA_LIVE_API_KEY"
      provider_preset: "openai"
      api_type: "chat_completions"
      mode: "proxy"
      capabilities:
        chat_completions: true
        responses: true
        models: true
        tool_calling: true
      model_capabilities:
        deepseek-flash:
          chat_completions: true
          responses: true
          tool_calling: true

  - id: "baizhi-anthropic"
    enabled: true
    priority: 100
    weight: 1.0
    capacity_hint: 1.0
    model_discovery: "list_models"
    static_models: ["deepseek-flash"]
    upstream:
      base_url: "$env:TRAJECTA_LIVE_MESSAGES_BASE"
      api_key: "$env:TRAJECTA_LIVE_API_KEY"
      provider_preset: "anthropic"
      protocol_family: "anthropic_messages"
      api_type: "messages"
      mode: "proxy"
      capabilities:
        chat_completions: false
        models: true
        tool_calling: true

debug:
  output_dir: "$env:TRAJECTA_LIVE_SQLITE_DIR"
  mask_key: true

chaos:
  enabled: false
  rules: []
