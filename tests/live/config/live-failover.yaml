# Failover / retry configuration: two OpenAI-compatible channels for the same
# model, the higher-priority one pointing at an unreachable address, on ports
# 18094/18095. Used by tests/live failover checks.
#
# Secrets are referenced through $env: so this file is safe to keep in the repo.
server:
  port: "18094"

monitor:
  port: "18095"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "$env:TRAJECTA_LIVE_FAILOVER_DIR"

responses_server:
  default_model: "deepseek-flash"
  force_store: true
  auto_compact: true
  codex_compat:
    enabled: false
  function_executors:
    enabled: false

tools:
  web_search:
    enabled: false
    provider: "disabled"
  mcp:
    enabled: false
    servers: []

router:
  model_discovery:
    enabled: false
  selection:
    policy: "first_available"
    failure_threshold: 1
    open_window: 60s

# Channels are configured in the Monitor and stored in the application database.
debug:
  output_dir: "$env:TRAJECTA_LIVE_FAILOVER_DIR"
  mask_key: true

chaos:
  enabled: false
  rules: []
