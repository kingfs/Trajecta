# Chaos / fault-injection configuration: same stack as live-sqlite.yaml but with
# chaos.enabled=true and a deterministic (rate=1.0) delay rule, on ports
# 18092/18093. Used by tests/live fault-injection checks.
#
# Secrets are referenced through $env: so this file is safe to keep in the repo.
server:
  port: "18092"

monitor:
  port: "18093"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "$env:TRAJECTA_LIVE_CHAOS_DIR"

responses_server:
  default_model: "deepseek-flash"
  force_store: true
  auto_compact: true
  codex_compat:
    enabled: false
  function_executors:
    enabled: false

tools:
  web_search:
    enabled: false
    provider: "disabled"
  mcp:
    enabled: false
    servers: []

router:
  model_discovery:
    enabled: true
    refresh_interval: 10m

# Channels are configured in the Monitor and stored in the application database.
debug:
  output_dir: "$env:TRAJECTA_LIVE_CHAOS_DIR"
  mask_key: true

chaos:
  enabled: true
  rules:
    - model: "deepseek-flash"
      rate: 1.0
      action: "error"
      status_code: 503
      message: "chaos-injected-503"
