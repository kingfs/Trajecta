# Total-outage configuration: every channel for the model points at an
# unreachable address, on ports 18096/18097. Used to pin the client-visible
# error contract when no upstream can serve the request.
#
# Secrets are referenced through $env: so this file is safe to keep in the repo.
server:
  port: "18096"

monitor:
  port: "18097"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "$env:TRAJECTA_LIVE_OUTAGE_DIR"

responses_server:
  default_model: "deepseek-flash"
  force_store: true
  auto_compact: true
  codex_compat:
    enabled: false
  function_executors:
    enabled: false

tools:
  web_search:
    enabled: false
    provider: "disabled"
  mcp:
    enabled: false
    servers: []

router:
  model_discovery:
    enabled: false
  selection:
    policy: "first_available"
    failure_threshold: 2
    open_window: 60s

# Channels are configured in the Monitor and stored in the application database.
debug:
  output_dir: "$env:TRAJECTA_LIVE_OUTAGE_DIR"
  mask_key: true

chaos:
  enabled: false
  rules: []
