# Total-outage configuration: every channel for the model points at an
# unreachable address, on ports 18096/18097. Used to pin the client-visible
# error contract when no upstream can serve the request.
#
# Secrets are referenced through $env: so this file is safe to keep in the repo.
server:
  port: "18096"

monitor:
  port: "18097"

mcp:
  enabled: true
  path: "/mcp"

auth:
  session_ttl: 24h

database:
  driver: "sqlite"
  dsn: ""
  max_open_conns: 4
  max_idle_conns: 4
  auto_migrate: true

trace:
  output_dir: "$env:TRAJECTA_LIVE_OUTAGE_DIR"

responses_server:
  default_model: "deepseek-flash"
  force_store: true
  auto_compact: true
  codex_compat:
    enabled: false
  function_executors:
    enabled: false

tools:
  web_search:
    enabled: false
    provider: "disabled"
  mcp:
    enabled: false
    servers: []

router:
  model_discovery:
    enabled: false
  selection:
    policy: "first_available"
    failure_threshold: 2
    open_window: 60s
  fallback:
    on_missing_model: "reject"

upstreams:
  - id: "baizhi-openai"
    enabled: true
    priority: 100
    weight: 1.0
    capacity_hint: 1.0
    model_discovery: "list_models"
    static_models: ["deepseek-flash"]
    upstream:
      base_url: "http://127.0.0.1:2/v1"
      api_key: "$env:TRAJECTA_LIVE_API_KEY"
      provider_preset: "openai"
      api_type: "chat_completions"
      mode: "proxy"
      capabilities:
        chat_completions: true
        responses: true
        models: true
        tool_calling: true
      model_capabilities:
        deepseek-flash:
          chat_completions: true
          responses: true
          tool_calling: true

  - id: "broken-openai"
    enabled: true
    priority: 50
    weight: 1.0
    capacity_hint: 1.0
    model_discovery: "static_only"
    static_models: ["deepseek-flash"]
    upstream:
      base_url: "http://127.0.0.1:1/v1"
      api_key: "unused"
      provider_preset: "openai"
      api_type: "chat_completions"
      mode: "proxy"
      capabilities:
        chat_completions: true
        models: false
        tool_calling: true
      model_capabilities:
        deepseek-flash:
          chat_completions: true
          tool_calling: true

debug:
  output_dir: "$env:TRAJECTA_LIVE_OUTAGE_DIR"
  mask_key: true

chaos:
  enabled: false
  rules: []
