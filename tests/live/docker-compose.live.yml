# Live functional-test stack: the locally built image plus a disposable Postgres.
#
# Usage (from the repository root):
#   export TRAJECTA_LIVE_API_KEY=sk-...
#   docker compose -f tests/live/docker-compose.live.yml up -d --build
#
# The upstream key never enters this file: the config references
# $env:TRAJECTA_LIVE_API_KEY and compose forwards it into the container.
services:
  trajecta-live:
    image: trajecta:local
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        GOPROXY: ${DOCKER_BUILD_GOPROXY:-https://goproxy.cn,direct}
        GOSUMDB: ${DOCKER_BUILD_GOSUMDB:-off}
        HTTP_PROXY: ${DOCKER_BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${DOCKER_BUILD_NO_PROXY:-}
        http_proxy: ${DOCKER_BUILD_http_proxy:-}
        https_proxy: ${DOCKER_BUILD_https_proxy:-}
        no_proxy: ${DOCKER_BUILD_no_proxy:-}
    depends_on:
      postgres-live:
        condition: service_healthy
    environment:
      TRAJECTA_CONFIG: /app/config/config.yaml
      TRAJECTA_DATABASE_DSN: postgres://trajecta:trajecta@postgres-live:5432/trajecta_live?sslmode=disable
      TRAJECTA_LIVE_API_KEY: ${TRAJECTA_LIVE_API_KEY:?set TRAJECTA_LIVE_API_KEY}
      TRAJECTA_LIVE_CHAT_BASE: ${TRAJECTA_LIVE_CHAT_BASE:-https://ai-api-gateway.app.baizhi.cloud/api/openai}
      TRAJECTA_LIVE_MESSAGES_BASE: ${TRAJECTA_LIVE_MESSAGES_BASE:-https://ai-api-gateway.app.baizhi.cloud/api/anthropic}
      NO_PROXY: ${NO_PROXY:-}
      no_proxy: ${no_proxy:-}
    ports:
      - "${TRAJECTA_LIVE_SERVER_PORT:-18080}:8080"
      - "${TRAJECTA_LIVE_MONITOR_PORT:-18081}:8081"
    volumes:
      - ./config/live-postgres.yaml:/app/config/config.yaml:ro
      - ${TRAJECTA_LIVE_TRACE_DIR:-/tmp/trajecta-test/traces}:/app/data/traces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/app/bin/server", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-live:
    image: postgres:17-alpine
    shm_size: "1gb"
    environment:
      POSTGRES_DB: trajecta_live
      POSTGRES_USER: trajecta
      POSTGRES_PASSWORD: trajecta
    ports:
      - "${TRAJECTA_LIVE_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajecta -d trajecta_live"]
      interval: 5s
      timeout: 5s
      retries: 20
