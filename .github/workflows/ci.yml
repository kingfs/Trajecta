name: Go CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        cache: true

    - name: Install Go dependencies
      run: go mod download

    - name: Install UI dependencies
      working-directory: web/monitor-ui
      run: bun install --frozen-lockfile

    - name: Build Trace Monitor UI
      working-directory: web/monitor-ui
      run: bun run build

    - name: Build
      run: |
        go build -v -o server ./cmd/server
        go build -v -o trajecta ./cmd/trajecta

    - name: Check Go formatting
      run: |
        unformatted="$(gofmt -l ./cmd ./internal ./pkg ./unittest ./tests ./web/monitor-ui/test-fixtures)"
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.15.0

    - name: Test
      run: go test -v ./...

    # AllocGate 分配门禁（TestAllocGate*）是普通 Go 测试，已随上一步
    # go test ./... 执行，无需重复。这里只把热路径基准各跑一次，
    # 保证 benchmark 可编译可运行、不腐烂；时间不做硬门禁。
    - name: Benchmark smoke
      run: go test -run '^$' -bench . -benchtime 1x ./pkg/xir ./pkg/session ./pkg/recordfile ./pkg/secretmask ./internal/gateway ./internal/router

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Validate ATIF v1.8 export
      run: |
        python -m pip install -r scripts/atif-requirements.txt
        python -m unittest discover -s scripts/atif_tests
        ATIF_TEST_OUTPUT_DIR="$RUNNER_TEMP" go test ./internal/trajectory -run TestBuildCumulativeHistoryAndHumanCorrection -count=1
        python scripts/validate_atif.py "$RUNNER_TEMP/session.jsonl"

    - name: Install Playwright Chromium
      working-directory: web/monitor-ui
      run: bunx playwright install --with-deps chromium

    - name: Monitor UI smoke tests
      working-directory: web/monitor-ui
      run: bun run test:ui

    - name: Monitor UI real-server tests
      working-directory: web/monitor-ui
      run: bun run test:ui:real

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: trajecta-linux-amd64
        path: trajecta

  # Postgres-gated integration tests (TRAJECTA_TEST_POSTGRES_DSN): versioned
  # migrations and their idempotency, read pool / statement timeout, overview
  # GROUPING SETS parity, rpm/tpm read models, secret-mapping admin, the
  # Responses runtime store, and the legacy SQLite->Postgres merge / layout
  # apply paths. Without this job those tests only run on machines that happen
  # to export a DSN. Packages share one disposable database, so they run
  # serially (-p 1): several suites apply migrations to the same DSN.
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trajecta
          POSTGRES_PASSWORD: trajecta
          POSTGRES_DB: trajecta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trajecta -d trajecta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.x'
        cache: true

    - name: Install Go dependencies
      run: go mod download

    - name: Postgres integration tests
      env:
        TRAJECTA_TEST_POSTGRES_DSN: postgres://trajecta:trajecta@127.0.0.1:5432/trajecta_test?sslmode=disable
      run: |
        go test -p 1 -count=1 \
          ./internal/appdbmigrate ./internal/auth ./internal/cli \
          ./internal/legacymigrate ./internal/monitor \
          ./internal/responses/... ./internal/store

  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 自动生成 tags（latest / sha / version tag）
    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/trajecta
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha
          type=ref,event=tag

    - name: Build and push multi-arch
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
