# pkg/secretmask carries a fixture corpus: every rule needs a value that proves
# the pattern fires, and a realistic fixture is exactly what a secret scanner is
# built to flag.  One of them has to satisfy a checksum that the rule validates,
# so it cannot be shortened or given an invalid character.  The format reference
# documents the same shapes and uses fabricated examples for them, and the proxy
# end-to-end test is not listed here because it already builds its key by
# concatenation and therefore leaves no whole token in the file.
#
# None of those values is a credential.  This list exists so that push protection
# does not block every change that touches a rule and so that secret scanning
# does not open an alert per fixture.  An excluded path also skips push
# protection, so keep this list at the fixtures and no wider: a real key that
# reaches one of these files will not be reported.  Move an entry when a fixture
# moves out from under it.
paths-ignore:
  - "pkg/secretmask/*_test.go"
  - "docs/SECRET_FORMAT_REFERENCE.md"
